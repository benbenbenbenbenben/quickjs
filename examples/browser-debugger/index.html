<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QuickJS Browser Debugger Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 0.5rem 1rem;
        background: #222;
        color: #fff;
        font-size: 0.9rem;
      }
      main {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        grid-template-rows: auto 1fr;
        grid-template-areas:
          "toolbar toolbar"
          "editor side";
        gap: 0.5rem;
        padding: 0.5rem;
        flex: 1;
        box-sizing: border-box;
      }
      #toolbar {
        grid-area: toolbar;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      #editor {
        grid-area: editor;
        border: 1px solid #ccc;
      }
      #side {
        grid-area: side;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      #debugger-ui, #inspector, #console {
        border: 1px solid #ccc;
        padding: 0.25rem 0.5rem;
        font-size: 0.8rem;
        background: #fafafa;
      }
      #debugger-ui h2, #inspector h2, #console h2 {
        margin: 0 0 0.25rem;
        font-size: 0.8rem;
      }
      #console-log {
        height: 7rem;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        white-space: pre-wrap;
      }
      #stack, #locals {
        max-height: 7rem;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        white-space: pre-wrap;
      }
      button {
        font-size: 0.8rem;
        padding: 0.2rem 0.5rem;
      }
      input[type="text"] {
        font-size: 0.8rem;
        padding: 0.15rem 0.3rem;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <header>
      QuickJS Browser Debugger Example (CodeMirror 6)
    </header>
    <main id="app">
      <div id="toolbar">
        <button id="run">Run</button>
        <button id="step" disabled>Step</button>
        <button id="cont" disabled>Continue</button>
        <span id="status">Loading QuickJS wasm...</span>
      </div>
      <div id="editor"></div>
      <div id="side">
        <section id="debugger-ui">
          <h2>Debugger</h2>
          <div><strong>Location:</strong> <span id="location">&ndash;</span></div>
          <div><strong>Stack:</strong></div>
          <pre id="stack"></pre>
        </section>
        <section id="inspector">
          <h2>Inspector</h2>
          <div style="display:flex; gap:0.25rem; align-items:center;">
            <span>Eval:</span>
            <input id="inspect-input" type="text" placeholder="expression (e.g. x)" />
            <button id="inspect-run">Go</button>
          </div>
          <pre id="locals"></pre>
        </section>
        <section id="console">
          <h2>Console</h2>
          <pre id="console-log"></pre>
        </section>
      </div>
    </main>
    <script src="/quickjs-browser.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
